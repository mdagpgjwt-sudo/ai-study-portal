<script id="curriculum-data" type="application/json">[{"id":1,"title":"Python","priority":"P0","subtitle":"処理を自力で組み立て、既存コードを直す","why":"自動化、API、データ処理の中心。文法の暗記より、入力→処理→出力を関数に分けて変更できることが重要。","steps":["値・型：list、dict、set、Noneを区別する","制御：if、for、関数、戻り値、内包表記","保守：例外、型ヒント、モジュール分割、標準ライブラリ"],"mental":"関数は「入力と出力が明確な処理の箱」。1つの関数が何を保証するか決めると、変更・テストが容易になる。","code":"def total_valid_prices(rows: list[dict]) -> int:\n    total = 0\n    for row in rows:\n        price = row.get(\"price\")\n        if isinstance(price, int) and price >= 0:\n            total += price\n    return total\n\nrows = [{\"price\": 120}, {\"price\": None}, {\"price\": 80}]\nprint(total_valid_prices(rows))  # 200","lang":"python","tasks":["この関数が「何を受け取り、何を返すか」を説明する","0円、負数、文字列、キー欠損で結果を確認する","「金額0円は有効」を保ったまま仕様変更する"],"pass_condition":"見慣れない関数でも入出力を特定し、機能追加・エラー修正を説明できる。","pitfall":"プログラミング未経験なら、Python公式チュートリアルは最初から易しい教材とは限らない。コード実行と短い実験を先に挟む。","question":"例の関数が row.get(\"price\") を使う理由は？","options":["キーが無いときも None を返して判定できる","実行速度を必ず2倍にする","辞書をソートする"],"answer":0,"explain":"辞書のキーが無い場合に例外を避け、値の検証へ進める。","sources":[["Python公式チュートリアル","https://docs.python.org/3/tutorial/"],["Python標準ライブラリ","https://docs.python.org/3/library/"]],"deps":[],"reading":["rows は辞書のリスト。for は1件ずつ取り出す。","get('price') はキー欠損時に None を返す。","整数かつ0以上の場合だけ加算するので、結果は200。"],"run_hint":"Pythonを導入し、price.pyとして保存して python price.py を実行。","scene":"例えば、商品データから「正しい金額だけ」を合計したいとする。Pythonなら、商品を1件ずつ調べて、条件に合う金額だけを足す処理を作れる。","flow":["商品データ3件（120円・金額なし・80円）","1件ずつ調べ、整数かつ0円以上なら合計に加える","200を返す"],"terms":[["関数","何度も使う処理に名前を付けたもの。必要な情報を渡すと結果を返せる。"],["dict（辞書）","「price → 120」のように、名前と値をセットにして持つデータ。"],["None","「値がない」を表す特別な値。数字の0とは違う。"],["型ヒント","引数や戻り値の想定を示す注記。書いただけで実行時に自動検査されるわけではない。"]],"result":"この例はそのままPythonで実行できる。表示は「200」。関数が3件を調べ、金額がない1件を飛ばす。","first":"rows の120を300に変更して実行し、表示が380になるか確かめる。"},{"id":2,"title":"Git / GitHub","priority":"P0","subtitle":"変更を記録し、安全に戻し、第三者に示す","why":"採用時には作品の完成状態だけでなく、何をどう改善したかが判断材料になる。Gitは開発の変更履歴そのもの。","steps":["commitは変更の記録点、branchは独立した作業線","diffで変更箇所を読み、なぜ変えたか説明する","Pull Requestで変更の目的と検証を共有する"],"mental":"Gitは「ファイルを何度でも巻き戻せる履歴管理」。GitHubはその履歴を共有・レビューする場所。","code":"git init\ngit status\ngit add .\ngit commit -m \"Add data validator\"\ngit switch -c fix/empty-record\n# ファイルを直したら\ngit diff\ngit add .\ngit commit -m \"Handle missing records\"","lang":"bash","tasks":["作業を2コミット以上に分ける","独立したbranchで修正しdiffを見る","修正理由と検証手順をPull Request相当の文章にする"],"pass_condition":"目的に沿った小さなコミットを作り、変更履歴から修正内容を再現できる。","pitfall":"「GitHubにアップした」だけでは足りない。コミットの意味、差分、変更理由を説明できるようにする。","question":"git diff の目的は？","options":["本番環境へ自動配信する","変更前後の差分を確認する","GitHubアカウントを作る"],"answer":1,"explain":"変更が意図どおりかをコミット前に確認できる。","sources":[["Pro Git（日本語あり）","https://git-scm.com/book/ja/v2"],["GitHub：Gitの基礎","https://docs.github.com/en/get-started/using-git/about-git"]],"deps":[1],"reading":["git init でプロジェクトの履歴管理を始める。","add で今回の変更対象を選び、commit で記録する。","switch -c は別作業線を作り、diff で変更箇所を確認する。"],"run_hint":"Gitを導入したターミナルで、空の作業フォルダ内から順に実行。","scene":"コードを直したら、前より良くなったのか、どこを変えたのかを説明する必要がある。Gitは変更の記録を残し、GitHubはその記録をオンラインで共有する場所。","flow":["動くプログラムと変更前の状態","修正した内容を比較（diff）して、変更を記録（commit）","問題があれば過去の状態と比較できる"],"terms":[["commit","その時点の変更を履歴として記録すること。"],["branch","本体とは別の作業場所を作り、修正を分ける仕組み。"],["diff","変更前と変更後を比較し、何を足し・消したか表示するもの。"],["Pull Request","変更内容を見てもらい、取り込むか判断するための依頼。"]],"result":"これはPythonコードではなく、ターミナルで実行するGitコマンド。プロジェクトの変更が2回の記録として残る。","first":"テキストファイルを1つ作り、1行だけ変えて git diff で差を表示する。"},{"id":3,"title":"CLI・OS・開発環境","priority":"P0","subtitle":"自分と他人のPCで同じ作業を再現する","why":"環境の違いで動かない問題を減らす。プログラムを動かす前に、実行場所・Pythonの版・依存関係を把握する。","steps":["ターミナルでフォルダ移動、ファイル確認、実行を行う","仮想環境でプロジェクトごとにライブラリを分離する","環境変数とパス、依存関係の意味を理解する"],"mental":"仮想環境は「案件ごとの道具箱」。他案件とライブラリを混ぜないために使う。","code":"# Windows PowerShell の例\npy -m venv .venv\n.\\.venv\\Scripts\\python.exe -m pip install pytest\n.\\.venv\\Scripts\\python.exe -m pytest --version\n# 実行前に現在のフォルダを確認\nGet-Location","lang":"powershell","tasks":["作業用フォルダを作り、仮想環境を構築する","依存ライブラリをインストールして版を確認する","新しいフォルダに手順だけで環境を再現する"],"pass_condition":"「私のPCだけ動く」を避け、手順に従って新規環境で同じ結果が得られる。","pitfall":"WindowsではPowerShellとUnixシェルでコマンドが異なる。例をそのまま貼る前に実行環境を確認。","question":"仮想環境を使う主な理由は？","options":["Pythonをネット接続なしで必ず高速化する","全プログラムを自動でテストする","案件ごとの依存関係の衝突を避ける"],"answer":2,"explain":"別々のプロジェクトが異なるパッケージ版を使っていても共存できる。","sources":[["Python venv公式","https://docs.python.org/3/library/venv.html"],["pip公式ユーザーガイド","https://pip.pypa.io/en/stable/user_guide/"]],"deps":[1],"reading":["venv は .venv フォルダに独立したPython実行環境を作る。","仮想環境内の python.exe を指定すれば、activate なしでも使える。","pip と pytest の呼び出し元を同じPythonに揃える。"],"run_hint":"Windows PowerShellで作業用フォルダを開いて実行。","scene":"同じPythonコードなのに、自分のPCでは動いて他人のPCでは動かないことがある。原因の一つは、使っているPythonや追加機能の違い。開発環境を揃えて防ぐ。","flow":["作業フォルダとPython","専用の環境を作り、必要な追加機能を入れる","その環境で同じプログラムやテストを動かせる"],"terms":[["CLI／ターミナル","文章でコマンドを入力してPCを操作する画面。WindowsならPowerShellなど。"],["ライブラリ","他の人が作った再利用できるプログラムの部品。"],["仮想環境（venv）","プロジェクトごとにPythonの追加機能を分けるための環境。"],["依存関係","そのプログラムを動かすために必要なライブラリなど。"]],"result":"Windows PowerShell用の例。専用の .venv フォルダができ、その中に pytest が入る。コマンドを実行した場所を Get-Location で確認できる。","first":"PowerShellで Get-Location を実行し、今どのフォルダを操作しているか確認する。"},{"id":4,"title":"デバッグ・コード読解","priority":"P0","subtitle":"症状から原因を絞って修正する","why":"実務では新規作成だけでなく、壊れた処理・他人のコードを直す仕事が多い。AI生成コードの検証にも直結する。","steps":["再現条件を固定し、期待結果と実結果を区別する","エラーメッセージ・スタックトレースを読む","小さな範囲に切り分け、再発防止テストを追加する"],"mental":"バグ調査は推理。仮説を増やすより、再現条件で候補を消していく。","code":"def average(values):\n    return sum(values) / len(values)\n\n# 空リストだと ZeroDivisionError\n# 先に「空なら何を返す？」を仕様で決める\n# その後、失敗するテストを追加してから修正","lang":"python","tasks":["空のリストで失敗を再現する","仕様を「空なら None」と決めて修正する","空と通常入力のテストを追加する"],"pass_condition":"不具合を「再現→原因→修正→テスト」の順で説明できる。","pitfall":"闇雲にtry/exceptで例外を握り潰すと、障害が見えなくなる。","question":"再現できない不具合への最初の対応として適切なのは？","options":["入力・環境・操作手順を記録し再現条件を探す","全体をゼロから書き直す","例外処理ですべてのエラーを無視する"],"answer":0,"explain":"再現条件が分かれば問題箇所を段階的に絞れる。","sources":[["Python：エラーと例外","https://docs.python.org/3/tutorial/errors.html"],["Python pdb公式","https://docs.python.org/3/library/pdb.html"]],"deps":[1,3],"reading":["sum(values) は要素の合計、len(values) は要素数。","空リストの場合は len が0なので0で割ることになる。","仕様を決めてから0件の場合を分岐し、テストに固定する。"],"run_hint":"Pythonファイルに保存し、空のリストを渡して例外を観察する。","scene":"売上の平均を計算する関数が、データ0件のときだけ停止した。デバッグは、どの入力で止まるかを再現し、最初におかしくなる場所を探す作業。","flow":["データがない空のリスト []","合計0を、件数0で割ろうとする","ZeroDivisionError が起きる"],"terms":[["バグ","プログラムが期待した動きと違うこと。"],["デバッグ","バグの原因を調べて直すこと。"],["例外","処理を続けられない問題などを、プログラムが知らせる仕組み。"],["再現条件","どの入力・操作なら同じ問題が起きるかという条件。"]],"result":"この例は関数の定義だけなので、まだエラーは出ない。最後に average([]) を加えて実行すると、0で割るエラーが発生する。","first":"末尾に print(average([10, 20])) と print(average([])) を追加し、どちらで止まるか確認する。"},{"id":5,"title":"SQL・リレーショナルDB","priority":"P0","subtitle":"データを壊さず保存・取得・集計する","why":"案件の多くがデータベースを扱う。SQLだけでなく、主キー・一意制約・トランザクションが重要。","steps":["SELECT/WHERE/JOIN/GROUP BYで必要なデータを取り出す","主キー・外部キー・UNIQUEで整合性を守る","トランザクションで途中失敗時に一貫性を維持する"],"mental":"DBは共有の台帳。検索文だけでなく、誤記・重複・途中失敗を防ぐ規則を最初から設計する。","code":"CREATE TABLE products (\n  id INTEGER PRIMARY KEY,\n  sku TEXT NOT NULL UNIQUE,\n  price INTEGER NOT NULL CHECK (price >= 0)\n);\nINSERT INTO products (id, sku, price)\nVALUES (1, 'A001', 120);\nSELECT sku, price FROM products WHERE price >= 100;","lang":"sql","tasks":["表を2つ作りJOINする","同じskuを2回登録してUNIQUEの動作を確認する","更新を途中で失敗させ、ロールバックを試す"],"pass_condition":"登録・検索・更新の各操作でデータが矛盾しない設計を説明できる。","pitfall":"アプリ側だけで重複をチェックすると競合時に抜ける。DBの制約も使う。","question":"UNIQUE制約の主な役割は？","options":["すべての列を暗号化する","同じ値の重複登録をDB側で拒否する","検索を必ずゼロ秒にする"],"answer":1,"explain":"競合を含め、DB自身が重複を防ぐ。","sources":[["PostgreSQL公式SQLチュートリアル","https://www.postgresql.org/docs/current/tutorial.html"],["SQLite公式SQLガイド","https://www.sqlite.org/lang.html"]],"deps":[1,3],"reading":["PRIMARY KEY は1行を区別するID。","UNIQUE はSKUの重複登録を拒否し、CHECK は負数を防ぐ。","SELECT は条件に一致した行のSKUと価格を取り出す。"],"run_hint":"SQLiteやPostgreSQLのSQL実行環境で実行。構文は共通部分の例。","scene":"商品を何千件も保存し、「100円以上の商品だけ探したい」ときに使うのがデータベースとSQL。商品番号の重複やマイナス価格を防ぐ決まりも付けられる。","flow":["商品番号・商品名・価格などの情報","表に保存し、条件に合う行を探す","条件に合う商品の一覧を返す"],"terms":[["データベース（DB）","大量の情報を整理して保存・検索する仕組み。"],["SQL","データベースに「探す・追加する・更新する」と指示する言葉。"],["PRIMARY KEY（主キー）","各行を区別するための番号など。"],["UNIQUE","同じ値の重複を禁止するルール。"],["トランザクション","複数の変更をひとまとまりとして扱い、途中の失敗に対応する仕組み。"]],"result":"商品番号 A001、120円の商品を1件登録し、100円以上という条件で検索すると A001 と 120 が取得される。SQLiteなどのSQL実行環境が必要。","first":"SELECT の条件を price >= 200 に変え、結果が0件になることを確かめる。"},{"id":6,"title":"HTTP・API","priority":"P0","subtitle":"他のシステムとデータを交換する","why":"データ連携の根幹。HTTPのリクエスト・レスポンス、認証、タイムアウトを理解すると外部APIの不具合を追える。","steps":["HTTPメソッドとステータスコードを区別する","JSONの構造と入力検証を理解する","タイムアウト・レート制限・認証失敗を別々に処理する"],"mental":"APIはサービスへの注文窓口。「何を頼むか（リクエスト）」「どう返ったか（レスポンス）」を契約で定義する。","code":"import json\nfrom urllib.request import Request, urlopen\n\nreq = Request(\"https://api.github.com/repos/python/cpython\",\n              headers={\"User-Agent\": \"skill-lab-study\"})\nwith urlopen(req, timeout=5) as response:\n    data = json.load(response)\nprint(data[\"full_name\"])","lang":"python","tasks":["GETとPOSTの違いを説明する","成功200、入力失敗400、権限なし403、存在しない404を区別する","タイムアウトや失敗応答が来たときの動作を決める"],"pass_condition":"APIが失敗しても原因を切り分け、再試行の可否を判断できる。","pitfall":"通信エラーに対して無制限に再試行すると、相手サービスの負荷や二重登録につながる。","question":"HTTP 404が表すものは？","options":["サーバーは必ず正常稼働","APIキーが必ず期限切れ","要求したリソースが見つからない"],"answer":2,"explain":"404は一般に対象リソースが見つからないことを示す。","sources":[["MDN：HTTP概要","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview"],["MDN：HTTPステータス","https://developer.mozilla.org/ja/docs/Web/HTTP/Status"]],"deps":[1,3],"reading":["Request にはURLとHTTPヘッダーを設定している。","urlopen(..., timeout=5) は応答を待つ上限時間を指定する。","受け取ったJSONを辞書に読み替え、full_nameを取り出す。"],"run_hint":"Pythonファイルに保存して実行。外部ネット接続が必要で、接続先の応答は変わる場合がある。","scene":"天気・商品・株価などの情報を別のサービスから受け取りたいとき、APIを利用する。相手に依頼を送り、返ってきたデータをプログラムで使う。","flow":["どの情報が欲しいかをURLなどで伝える","ネット経由で相手に依頼し、返事の中のJSONを読む","欲しい項目だけを取り出す"],"terms":[["API","別のサービスの機能や情報を、決まった手順で利用するための窓口。"],["HTTP","Web上で依頼と返事をやり取りするための基本ルール。"],["JSON","{ \"price\": 120 } のように情報を表す文字形式。"],["タイムアウト","返事が長時間こないときに、待つのをやめること。"]],"result":"GitHubの公開APIから Python の開発リポジトリ情報を取得し、通常は「python/cpython」と表示する。通信が必要で、制限や障害時は失敗する場合がある。","first":"print(data[\"full_name\"]) を print(data[\"description\"]) に変えて、別の項目を表示する。"},{"id":7,"title":"FastAPI・バックエンド","priority":"P1","subtitle":"HTTPの入口と内部の処理をつなぐ","why":"求人で求められるAPI開発に直結。入力検証、責務分割、レスポンスの明確さを意識する。","steps":["URL・HTTPメソッドと関数を対応づける","型による入力・出力の検証を行う","ルートとDB操作・業務ロジックを分離する"],"mental":"ルートは受付。実際の処理は別の担当関数へ任せると変更に強い。","code":"# main.py\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI()\nclass Product(BaseModel):\n    sku: str\n    price: int\n\n@app.post(\"/products\")\ndef create_product(product: Product):\n    return {\"sku\": product.sku, \"price\": product.price}\n\n# pip install fastapi uvicorn\n# uvicorn main:app --reload","lang":"python","tasks":["FastAPIでGETとPOSTを実装する","入力が欠けた場合の422応答を確認する","処理部分を別関数に分離してテストする"],"pass_condition":"データベースと接続するAPIを作り、入力エラー・正常応答を検証できる。","pitfall":"開発用 --reload をそのまま本番運用の設定と混同しない。","question":"APIのルートからDB処理を分ける理由は？","options":["変更・テストの対象を小さくするため","HTTP通信を必ず不要にするため","SQLを自動で暗号化するため"],"answer":0,"explain":"処理の責務を分ければ独立したテストや変更がしやすい。","sources":[["FastAPI公式チュートリアル","https://fastapi.tiangolo.com/ja/tutorial/"],["FastAPI：SQLデータベース","https://fastapi.tiangolo.com/ja/tutorial/sql-databases/"]],"deps":[1,5,6],"reading":["Product はリクエスト本文の期待する項目・型を定める。","@app.post はPOST /productsを関数に結びつける。","今の例は受け取って返すだけ。永続保存は後でDBと接続する。"],"run_hint":"main.pyとして保存し、コメントのコマンドでサーバーを起動。/docsから動作確認。","scene":"外部サービスから情報を「受け取る側」を自分で作りたいときに使う。例えば、商品情報を送ると内容を確認して返すAPIを作れる。","flow":["相手が /products に商品情報を送る","FastAPIが形式を確かめ、Pythonの関数を呼び出す","商品情報をJSONで返す"],"terms":[["バックエンド","利用者の画面の裏で、データ処理や保存を行う部分。"],["FastAPI","PythonでAPIの受付と処理を作れるライブラリ。"],["POST","データの登録・送信などで使うHTTPの依頼方法。"],["入力検証","必要な項目や値の種類が正しいか確認すること。"]],"result":"この例では、例えば {\"sku\":\"A001\",\"price\":120} をPOSTすると同じ内容がJSONで返る。まだデータベースには保存しない。","first":"サーバー起動後に /docs を開き、POST /products に sku と price を入力して送る。"},{"id":8,"title":"データ処理・ETL","priority":"P1","subtitle":"データを取得・加工・保存する","why":"企業のデータ連携案件でそのまま使う技能。毎回同じ処理を実行しても整合性を保つ「冪等性」が核心。","steps":["Extract：API・CSVから取得、Transform：検証・整形","Load：DBに保存。重複・更新の規則を明確にする","通信失敗時の再試行・再開・ログを設計する"],"mental":"ETLは情報の流れ作業。途中で止まっても、安全に再開できることが品質。","code":"# SQLiteの例（接続 conn は作成済みとする）\nconn.execute(\"\"\"\nINSERT INTO products (sku, price)\nVALUES (?, ?)\nON CONFLICT(sku) DO UPDATE SET price=excluded.price\n\"\"\", (\"A001\", 120))\nconn.commit()  # skuにUNIQUE制約が必要","lang":"python","tasks":["同じレコードを3回取り込んで件数が増えないことを確認する","途中で失敗した後、安全に再実行する","不正なデータだけを隔離して記録する"],"pass_condition":"再実行・部分失敗・重複を考慮したデータ処理を説明・実装できる。","pitfall":"「1回動いた」は合格ではない。2回目・途中停止・欠損時に正しい動作をするか確認。","question":"冪等性に最も近い説明は？","options":["ネット接続が常に必要になる","同じ操作を繰り返しても意図しない状態変化が起きない","処理が必ず並列実行される"],"answer":1,"explain":"繰り返し実行しても期待する最終状態を保つ設計が重要。","sources":[["PostgreSQL：INSERTと競合処理","https://www.postgresql.org/docs/current/sql-insert.html"],["Python csv公式","https://docs.python.org/3/library/csv.html"]],"deps":[1,5,6],"reading":["ON CONFLICT(sku) はSKUの重複が起きたときの分岐。","DO UPDATE で新しい価格を反映し、二重登録を避ける。","conn は事前に開いたSQLite接続。productsにはUNIQUE制約が必要。"],"run_hint":"先にSQLite接続とUNIQUE制約付きproducts表を用意してから処理を実行する。","scene":"複数サイトやCSVから毎日商品情報を集めるとき、保存するだけでは同じ商品が何度も増える。ETLは集める・整える・保存する流れを作る技術。","flow":["外部APIやCSVから商品情報を取る","形式を揃え、同じ商品番号のデータを探す","初回は登録、次回以降は価格だけ更新する"],"terms":[["ETL","Extract（取得）、Transform（加工）、Load（保存）の略。"],["冪等性（べきとうせい）","同じ処理を繰り返しても、結果が無意味に増えない性質。"],["ON CONFLICT","同じキーが既にあるとき、代わりに何をするか指定するSQL。"],["バッチ処理","データをまとめて、または定期的に処理すること。"]],"result":"これはSQLite接続 conn と products 表が用意された後に使う一部分。同じ sku の商品があれば価格を更新し、商品行を増やさない。","first":"「なぜ3回実行しても商品を3件にしない方がよいか」を言葉にしてから、実際に試す。"},{"id":9,"title":"自動テスト","priority":"P1","subtitle":"変更後も壊れていないことを確かめる","why":"AI生成コードや既存システム改修の信頼性を担保する。正常系だけでなく失敗系を検証する。","steps":["単体テストで小さい関数を検証する","結合テストでAPI・DBなどの接続部分を検証する","fixtureとmockでデータや外部サービスを制御する"],"mental":"テストは「うまく動いた」ではなく「こうあるべき」を実行できる仕様にしたもの。","code":"# test_price.py\nimport pytest\n\ndef discounted(price):\n    if price < 0:\n        raise ValueError(\"negative price\")\n    return price * 9 // 10\n\n@pytest.mark.parametrize(\"price, expected\", [(100, 90), (0, 0)])\ndef test_discounted(price, expected):\n    assert discounted(price) == expected\n\ndef test_negative():\n    with pytest.raises(ValueError):\n        discounted(-1)","lang":"python","tasks":["正常値・境界値・異常値のテストを3本作る","実装を意図的に壊してテストが失敗するか確認する","バグ修正前に再現テストを追加する"],"pass_condition":"失敗するテストを先に作り、修正後に合格する流れを実践できる。","pitfall":"テストがすべて通っても、検証していない仕様は守られない。カバレッジ100%は品質の保証ではない。","question":"バグ修正後の回帰テストの目的は？","options":["本番DBのデータを削除する","Pythonの文法エラーを自動で直す","同じ不具合が再発していないか確認する"],"answer":2,"explain":"修正した条件が将来も成立するかを確かめる。","sources":[["pytest公式：はじめる","https://docs.pytest.org/en/stable/getting-started.html"],["pytest：fixtures","https://docs.pytest.org/en/stable/how-to/fixtures.html"]],"deps":[1,4,7],"reading":["parametrize は同じテストを複数の入力で実行する。","assert は期待値との一致を検査する。","raises は不正な入力で例外が発生することを確認する。"],"run_hint":"test_price.pyに保存し、pip install pytest の後に python -m pytest で実行。","scene":"修正したコードが正しいか、毎回手で操作する代わりに自動で確かめる。例えば、100円を90円にする処理が0円や不正な金額でも正しく動くか確認できる。","flow":["入力と期待結果を組にして用意する","プログラムを動かし、結果が期待どおりか比較する","違えばテストが失敗して場所を知らせる"],"terms":[["pytest","Pythonのテストをまとめて実行する道具。"],["assert","実際の結果と期待結果が一致するか確認する命令。"],["正常系・異常系","普通に使ったときの動作／不正な入力などのときの動作。"],["回帰テスト","修正によって、以前動いていた機能が壊れていないか確認すること。"]],"result":"このテストでは「100→90」「0→0」「負数ならエラー」の3ケースを確認する。pytest を導入して実行する必要がある。","first":"期待値を90から80に変えてテストを実行し、わざと失敗させる。"},{"id":10,"title":"設計・仕様整理","priority":"P1","subtitle":"要求を変更可能な部品に分ける","why":"短時間で仕事を終えるために重要。機能よりも先に「何が成功か」「何が失敗か」を明示する。","steps":["入出力、境界条件、異常時の仕様を文章化する","責務を分離し、変更影響を小さくする","性能・復旧・認証など非機能要件を定義する"],"mental":"仕様は完成判定のルール。ルールを決めずに実装すると後で手戻りが発生する。","code":"# 仕様例：SKUの登録\n# 入力: sku (空文字不可), price (0以上の整数)\n# 正常: 201で新しいIDを返す\n# 重複: 409を返す\n# 不正: 422を返す\n# テスト: 通常・重複・空SKU・負数を確認","lang":"text","tasks":["曖昧な「商品を登録」の要求を5条件以上に分解する","各条件に対してテストを1本ずつ考える","仕様を変えた場合の影響箇所を列挙する"],"pass_condition":"実装前に成功条件を定義し、仕様変更の影響を説明できる。","pitfall":"コードの美しさだけでなく、変更しやすさ・作り直しの少なさが重要。","question":"仕様を最初に明確化する直接的な効果は？","options":["成功・失敗の判定基準が定まる","必要なテストがゼロになる","関係者との確認が永久に不要になる"],"answer":0,"explain":"曖昧な要求を観測可能な条件に変えられる。","sources":[["FastAPI：レスポンスステータス","https://fastapi.tiangolo.com/tutorial/response-status-code/"],["Python：typing","https://docs.python.org/3/library/typing.html"]],"deps":[1,4,7],"reading":["コードを書く前に成功・失敗の条件を文章化した例。","201は作成成功、409は競合、422は入力不正。","この仕様からテストケースとAPIの契約を作れる。"],"run_hint":"これはコードではなく仕様書の一例。各条件をテストに変換する。","scene":"「商品を登録できるようにして」とだけ言われても、空欄や重複をどう扱うかは決まっていない。作る前に成功と失敗の条件を整理するのが仕様設計。","flow":["「商品を登録したい」というあいまいな要望","入力・正常時・異常時のルールを決める","何を作り、何をテストするか明確になる"],"terms":[["仕様","プログラムが満たすべき約束。"],["要件","利用者が必要としている機能や条件。"],["境界条件","0件・0円・最大件数など、動作が変わりやすい境目の条件。"],["HTTP 409／422","409は競合、422は入力形式などが条件に合わないことを表す状態コード。"]],"result":"この例はPythonの実行コードではなく、商品登録のルールをコメントにした設計メモ。ここから実装とテストを作る。","first":"「同じ商品番号を2回登録したらどうするか」を1文で決める。"},{"id":11,"title":"認証・セキュリティ","priority":"P1","subtitle":"誰が何にアクセスできるか管理する","why":"第三者向けサービスでは必須。ログインできるか（認証）と、そのデータを操作できるか（認可）を区別する。","steps":["認証と認可の役割の違いを理解する","ユーザーごとのデータ所有権を確認する","APIキー・パスワード等の秘密情報をリポジトリに置かない"],"mental":"ログインは「本人確認」。所有者でない商品の編集を拒否するのは「権限判定」。","code":"# ルート内部の権限チェック例（前提: record/userは取得済み）\nfrom fastapi import HTTPException\n\nif record.owner_id != user.id:\n    raise HTTPException(status_code=403, detail=\"Forbidden\")\n# この後に初めて更新処理を実行する","lang":"python","tasks":["別ユーザーで他人のデータを読めないことを確認する","Gitの履歴も含めて秘密情報を漏らしていないか確認する","未認証401と認可失敗403をテストする"],"pass_condition":"誰がどの操作を実行できるかの規則を定義し、テストで検証できる。","pitfall":"画面上でボタンを非表示にするだけではアクセス制御にならない。サーバー側で判定する。","question":"認証と認可の違いは？","options":["両者は完全に同義","認証は本人確認、認可は操作の許可","認証はDB操作、認可は画面の色"],"answer":1,"explain":"「誰か」と「何ができるか」は別の判定。","sources":[["OWASP API Security Top 10","https://api-security.owasp.org/editions/2023/en/0x11-t10/"],["FastAPI：Security","https://fastapi.tiangolo.com/tutorial/security/"]],"deps":[6,7,9],"reading":["record.owner_id が現在ユーザーのIDと一致するか確認する。","異なる場合は403のHTTPエラーを返す。","認証済みユーザーでも所有者でないデータを編集させない。"],"run_hint":"FastAPIルート内で record と user を取得した後の部分コード。","scene":"ログインした人でも、他人の注文や商品を勝手に変更できてはいけない。本人かどうかと、その情報を操作してよいかは別々に確認する。","flow":["ログイン済みユーザーが商品の更新を依頼する","商品を所有する人のIDと、操作する人のIDを比較する","同じなら続行、違えば403で拒否する"],"terms":[["認証","「誰が操作しているか」を確認すること。"],["認可","その人に「この操作をしてよい権限があるか」を確認すること。"],["403","本人確認後でも、アクセスを許可できないときなどに返すHTTP状態コード。"],["APIキー","APIを利用する際の秘密情報。公開コードに直接書かない。"]],"result":"これは本物のAPIの一部分。record と user が事前に取得されている前提で、他人のデータなら403エラーにする。単体では動かない。","first":"「ログインできる人」と「この商品を編集できる人」が違う例を一つ考える。"},{"id":12,"title":"Docker","priority":"P1","subtitle":"実行環境をまとめて再現する","why":"「開発者のPCでは動くが、納品先では動かない」を減らす。アプリとDBなど複数サービスを扱う時にも便利。","steps":["イメージは実行環境の設計図、コンテナは実行インスタンス","Dockerfileでアプリ環境を構築する","ComposeでAPIとDBをまとめて起動する"],"mental":"Dockerは梱包箱。実行に必要なものを一定の形式で渡せる。ただし外部DBや秘密情報まですべて自動で安全になるわけではない。","code":"# Dockerfile の例（requirements.txt と main.py を用意）\nFROM python:3.13-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]","lang":"docker","tasks":["小さなFastAPIアプリのイメージを作る","コンテナを停止・削除して再作成する","データを保持する必要がある場所を見極める"],"pass_condition":"READMEの手順だけでアプリとDBを再現できる。","pitfall":"コンテナ内のファイルは常に永続保存されるわけではない。ボリュームの扱いが必要。","question":"Dockerイメージの主な役割は？","options":["プロジェクトの見た目を自動設計する","APIキーを必ず隠蔽する","コンテナを作るための実行環境の元になる"],"answer":2,"explain":"イメージを元にコンテナを起動する。","sources":[["Docker公式：コンテナ学習","https://docs.docker.com/learn/paths/get-started-with-docker-containers/"],["Dockerfile公式","https://docs.docker.com/reference/dockerfile/"]],"deps":[3,7],"reading":["FROM で基礎イメージを選び、WORKDIR で作業先を定める。","COPY→RUNで依存関係を導入し、アプリを配置する。","CMD はコンテナ起動時にAPIサーバーを開始する。"],"run_hint":"requirements.txt に fastapi と uvicorn を記述し、main.pyを用意して docker build する。","scene":"自分のPCでは動くアプリを、他のPCでも同じように動かしたいときに使う。Dockerは、アプリを動かすための環境を決まった手順で組み立てる。","flow":["Pythonアプリと必要なライブラリ一覧","Dockerfileの手順で実行環境を作る","決められた環境でアプリを起動する"],"terms":[["Dockerfile","実行環境をどのように作るか書いた手順書。"],["イメージ","手順に沿って用意した、実行環境の元になるもの。"],["コンテナ","イメージから実際に起動した実行環境。"],["Compose","APIとDBのような複数のコンテナをまとめて起動・管理する仕組み。"]],"result":"この例はDockerfileであり、Pythonコードではない。requirements.txt と main.py があり、Dockerを導入したPCで環境を作ると、APIサーバーを起動する設定になる。","first":"Dockerfileの FROM、COPY、RUN、CMD の4行がそれぞれ何を準備するのか順番に説明する。"},{"id":13,"title":"CI/CD","priority":"P1","subtitle":"変更するたびに品質確認する","why":"修正のたびに手動テストする負担を減らす。GitHub Actionsでテストを自動化できる。","steps":["CIは継続的統合、変更時にテストを実行する","workflowをYAMLで定義する","デプロイは別段階として安全な手順を設計する"],"mental":"CIは「毎回同じ検査をする検品機」。人間が確認を忘れても変更時に自動実行する。","code":"# .github/workflows/test.yml\nname: Python tests\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-python@v6\n        with:\n          python-version: '3.13'\n      - run: python -m pip install pytest\n      - run: python -m pytest","lang":"yaml","tasks":["pushした際に自動テストを実行する","意図的にテストを失敗させ赤い状態を確認する","修正して再び成功する状態に戻す"],"pass_condition":"変更履歴と自動テストの成功・失敗が紐付いている。","pitfall":"CIを設定してもテスト内容が不十分なら品質は保証されない。","question":"CIでpytestを実行する狙いは？","options":["変更ごとにテストを一定条件で繰り返す","すべての設計判断を自動で行う","開発者の責任をゼロにする"],"answer":0,"explain":"変更時の検品を自動化して漏れを減らす。","sources":[["GitHub Actions：Pythonテスト（日本語）","https://docs.github.com/ja/actions/tutorials/build-and-test-code/python"],["GitHub Actions公式","https://docs.github.com/en/actions"]],"deps":[2,9],"reading":["push と pull_request をきっかけにジョブを起動。","checkout でソースコードを取得し、setup-python で実行環境を用意。","pytest を実行して失敗ならワークフローを失敗扱いにする。"],"run_hint":"GitHubリポジトリの .github/workflows/test.yml に保存し、pushで起動する。","scene":"コードをGitHubに送るたび、テストを実行する作業を人間が忘れると不具合が残る。CIは、変更が送られたときに自動で検査する仕組み。","flow":["GitHubにコード変更を送る（push）","GitHub Actionsが指定のPythonテストを実行する","成功か失敗かが記録される"],"terms":[["CI","変更を取り込むたびに、ビルドやテストを自動確認する仕組み。"],["CD","確認後の公開・配布までを自動化する考え方。"],["GitHub Actions","GitHub上で決めた手順を自動実行する機能。"],["YAML","設定をインデントと項目名で書くファイル形式。"]],"result":"この設定を .github/workflows/test.yml に保存し、GitHubにpushすると、自動テストが実行される（対象リポジトリでActionsが利用できる場合）。","first":"workflowの on: [push, pull_request] を探し、いつ検査が始まるか説明する。"},{"id":14,"title":"運用・監視","priority":"P1","subtitle":"止まった原因を特定し、回復できるようにする","why":"継続的に使われるシステムは、作るよりも維持に手間がかかる。障害検知と復旧の設計が実務価値になる。","steps":["イベント・エラー・処理件数をログに残す","定期実行の失敗を検知して通知する","バックアップと復元手順を実際に試す"],"mental":"ログは「何が起こったかの記録」。監視は「今、問題が起きていることに気づく仕組み」。","code":"import logging\nlogging.basicConfig(level=logging.INFO)\nlogger = logging.getLogger(__name__)\n\ndef import_data(rows):\n    logger.info(\"import started count=%d\", len(rows))\n    # ここで実際に保存する\n    logger.info(\"import finished\")","lang":"python","tasks":["成功/失敗/処理件数をログで追えるようにする","異常時の再実行方法を文書化する","バックアップから別環境に復元できるか試す"],"pass_condition":"処理失敗時に「何が起き、どう戻すか」を示せる。","pitfall":"個人情報・認証トークンをログに出してはいけない。","question":"ログと監視の違いとして正しいのは？","options":["監視はすべてのバグを自動修正する","ログは出来事の記録、監視は問題の検知を支える仕組み","ログは画面デザインの記録"],"answer":1,"explain":"記録と検知は関連するが役割が違う。","sources":[["Python：Logging HOWTO","https://docs.python.org/3/howto/logging.html"],["Docker：ログ","https://docs.docker.com/engine/logging/"]],"deps":[4,8,9],"reading":["logging は処理状況を決まった形式で残す。","INFOは正常な処理の節目を追うレベル。","実際の運用では開始・完了だけでなく失敗原因も記録する。"],"run_hint":"Pythonファイルに保存。import_data([{...}]) などで呼んでログを観察。","scene":"夜中にデータ更新が失敗しても、誰も気づかなければサービスが古い情報を出し続ける。ログは作業記録、監視は問題を見つける仕組み。","flow":["定期処理を始める","開始・終了・失敗・処理件数を記録する","止まった場所や原因を追跡できる"],"terms":[["ログ","プログラムが何をしたかを時系列で残す記録。"],["監視","システムが止まっていないかなどを継続的に確認する仕組み。"],["バックアップ","故障や誤操作に備えたデータの別コピー。"],["復旧","問題が起きたあと、正常な状態に戻すこと。"]],"result":"この例は import_data(...) を呼んでいないため、実行だけでは処理ログは出ない。呼び出すと開始と終了のログが表示される。","first":"末尾に import_data([1,2,3]) を追加し、件数3の開始・終了ログが出るか確認する。"},{"id":15,"title":"文書化・非同期連絡","priority":"P1","subtitle":"会話を減らし、成果物だけで理解してもらう","why":"あなたの「人と話す負担を減らす」目的に直接つながる。実装だけでなく、相手が確認できる文章を残す。","steps":["READMEに目的・セットアップ・実行方法を書く","変更内容・確認したテスト・残課題を短く報告する","再現手順・期待結果・実結果を分けて記述する"],"mental":"良いドキュメントは、後から何度も同じ質問に答える必要を減らす。","code":"# README例\n## 目的\n公開APIから商品情報を定期取得する。\n## 起動\n1. 仮想環境を作成\n2. 依存関係を導入\n3. テストを実行\n## 制約\n外部APIが停止すると更新を保留する。","lang":"markdown","tasks":["初見の人向けに起動手順を3〜6段階にまとめる","不具合報告を「再現手順・期待・実際」で書く","変更の目的・テスト結果・残る問題を1ページにする"],"pass_condition":"第三者が口頭説明なしで環境を起動し、仕様を確かめられる。","pitfall":"説明を省略すると「非同期で楽になる」は成立しない。読み手が迷わない具体性が必要。","question":"再現性の高い不具合報告に必要なのは？","options":["感想だけ","プログラム全体の画像だけ","再現手順、期待結果、実際の結果"],"answer":2,"explain":"必要な情報を分離すると、相手が同じ問題を検証できる。","sources":[["GitHub：READMEについて","https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes"],["GitHub：Pull Request","https://docs.github.com/en/pull-requests"]],"deps":[2,4],"reading":["目的には誰のどの作業を解決するかを書く。","起動手順は別のPCで再現できる具体性が必要。","制約を書けば「動かない条件」を先に共有できる。"],"run_hint":"GitHubリポジトリの README.md の骨組みにできる。","scene":"他人から「動かない」と言われても、起動手順や必要な設定が書かれていなければ何度も説明が必要になる。文章で情報を残すと、会話や問い合わせを減らせる。","flow":["プログラムの目的・起動方法・制約を整理する","READMEに順番を追って書く","初めて触る人が自力で起動・検証できる"],"terms":[["README","プロジェクトの目的や使い方を書く案内ファイル。"],["非同期連絡","同時に通話せず、メッセージや文書で情報をやり取りすること。"],["再現手順","同じ問題や操作を他人も試せるようにした手順。"]],"result":"これはプログラムではなく、READMEに書く文章の例。実際のファイル名やコマンドまで書くと、より再現しやすくなる。","first":"自分で作ったPythonファイルの起動方法を、他人向けに3手順で書く。"},{"id":16,"title":"クラウド","priority":"P2","subtitle":"第三者がアクセスできる場所で運用する","why":"ローカルで完了する仕事なら後回しでよい。SaaS・公開APIでは必要度が上がる。","steps":["コンピュート、DB、ストレージ、ネットワークの役割","認証情報・権限・料金・利用量の管理","HTTPS、バックアップ、デプロイ・障害復旧"],"mental":"クラウドは借りるインフラ。月額料金、障害、権限管理も開発者の責任範囲になる。","code":"# アプリが環境変数から設定を読む例\nimport os\n\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\n# 本物のパスワードをコードやGit履歴に書かない","lang":"python","tasks":["ローカルと公開環境の違いを説明する","小さなAPIの想定月額費用を計算する","秘密情報とバックアップを含む運用手順を作る"],"pass_condition":"アプリ公開後も費用・権限・復旧を管理できる。","pitfall":"無料枠は永久・無制限ではない。従量課金や公開設定を確認する。","question":"環境変数に機密設定を分ける主な理由は？","options":["コードと秘密情報を分離して管理できる","無限の無料クラウド容量が手に入る","すべてのデータを自動暗号化する"],"answer":0,"explain":"設定をコードから切り離せるが、環境変数の取り扱いにも注意が必要。","sources":[["AWS Well-Architected","https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"],["Google Cloud：Cloud Run","https://cloud.google.com/run/docs/overview"]],"deps":[7,11,12],"reading":["DATABASE_URL は環境ごとに変えられる設定。","os.environ から読み、コードに接続先を固定しない。","環境変数を使っても秘密の管理やアクセス権は別途必要。"],"run_hint":"実行前に環境変数 DATABASE_URL を設定する。未設定なら KeyError ル、RPAの連携方法の使い分け","実行失敗時の再開と二重処理防止","業務ルール・例外ケースの整理"],"mental":"APIは仕組み同士の直接対話。RPAは画面上の操作の自動化で、UI変更の影響を受けやすい。","code":"# 連携の中心は独立した変換関数にする\ndef normalize_order(raw):\n    return {\n        \"order_id\": str(raw[\"id\"]),\n        \"amount\": int(raw[\"total\"]),\n    }\n# 入力元がCSVでもRPAでも再利用できる","lang":"python","tasks":["CSV入力を別の形式に変換する","同じデータを2回処理しても重複しないようにする","APIが使える場合と画面操作しかない場合を比較する"],"pass_condition":"業務の例外条件と再実行方法を含む自動化を提案・実装できる。","pitfall":"画面をクリックするだけの手順では、UI変更で容易に壊れる。","question":"APIが利用できる場合の一般的な利点は？","options":["必ずすべて無料になる","認証の検討が不要になる","画面配置の変更に依存しにくい"],"answer":2,"explain":"API連携はUI操作より安定的に設計しやすい場合が多い。","sources":[["Microsoft Power Automate","https://learn.microsoft.com/ja-jp/power-automate/"],["n8n公式ドキュメント","https://docs.n8n.io/"]],"deps":[6,8],"reading":["normalize_order は入力元ごとの形式を共通形にそろえる。","画面操作から入力しても、CSVから入力しても同じ関数を使える。","外部システムとの通信とデータ加工を分離すると変更しやすい。"],"run_hint":"Pythonファイルに保存し、辞書を渡して戻り値を見る。","scene":"毎朝、複数のシステムから注文情報を集めて同じ形式に揃えたい。APIでつなげられるなら直接つなぎ、APIがない場合は画面操作を自動化する方法もある。","flow":["CSV・Web画面・APIなど形式の違う注文情報","必要な項目を取り出し、同じ名前と型に揃える","後続処理が共通の形式で注文を扱える"],"terms":[["RPA","人間のクリックや入力など、画面上の繰り返し作業を自動化する仕組み。"],["API連携","システム同士を決まった窓口で直接つなぐこと。"],["正規化（ここでは）","表記やデータ形式を、扱いやすい共通形式に整えること。"]],"result":"この関数は注文データの id と total を、共通の order_id（文字列）と amount（整数）に直して返す。実行には関数を呼び出す必要がある。","first":"normalize_order({\"id\":7,\"total\":\"1200\"}) を呼び、文字列の\"7\"と整数1200になっているか確認する。"},{"id":19,"title":"LLM・AIシステム開発","priority":"P2","subtitle":"AIの出力を「検証可能な処理」にする","why":"LLMに文章を生成させるだけでなく、失敗判定・再試行・費用・個人情報を扱う必要がある。","steps":["入力・出力を明確にし、構造化データを検証する","評価用データセットで精度・失敗率・費用を測る","ツール利用・RAG・モデル更新時の挙動変化を検証する"],"mental":"LLMは確率的な部品。データベースや業務フローに入れるときは、周辺を決定的な検証で固める。","code":"import json\n\ndef parse_llm_output(text):\n    data = json.loads(text)\n    if not isinstance(data.get(\"tags\"), list):\n        raise ValueError(\"tags must be a list\")\n    return data\n\n# モデル呼び出し後の出力を必ず検証する","lang":"python","tasks":["同じ課題でAI出力の成功・失敗例を20件集める","正答率と失敗パターンを記録する","不正なJSONや誤った型を拒否する"],"pas try {let saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved&&typeof saved==='object'){state={...state,...saved}; if(!state.lessons||typeof state.lessons!=='object')state.lessons={}; if(!Array.isArray(state.project))state.project=[]; if(!state.notes||typeof state.notes!=='object')state.notes={};}}catch(e){console.warn('Save data not loaded',e)}
let view='home', selectedId=1, query='';

function updateProgress(){let n=numDone(); for(let id of ['sidebarProgress','topProgress','mobileCount']) {let el=document.getElementById(id); if(el)el.textContent=id==='topProgress'?`実技完了 ${n} / 20`:`${n} / 20`;}for(let id of ['sideBar','topBar'])document.getElementById(id).style.width=(n*5)+'%';}

function renderSide(){let root=$('#sidebarSkills');root.innerHTML=['P0','P1','P2'].map(p=>`<div class="section-label"><span>${p==='P0'?'P0 ｜基礎':'P1'===p?'P1 ｜実務':'P2 ｜専門'}</span><span>${lessons.filter(x=>x.priority===p&&completed(x.id)).length}/${lessons.filter(x=>x.priority===p).length}</span></div>${lessons.filter(x=>x.priority===p).map(s=>`<a href="?page=lesson-${s.id}" target="_blank" rel="noopener noreferrer" data-lesson="${s.id}" class="${view==='lesson'&&selectedId===s.id?'active':''}" aria-label="${esc(s.title)}"><span class="skill-index">${String(s.id).padStart(2,'0')}</span><span>${esc(s.title)}</span><span class="status-dot ${completed(s.id)?'done':inProgress(s.id)?'active':''}"></span></a>`).join('')}`).join('');
  /* Lesson links use native target=_blank anchors. */}
function home(){
let next=lessons.find(s=>!completed(s.id))||lessons[0];let p0=lessons.filter(s=>s.priority==='P0'&&completed(s.id)).length,p1=lessons.filter(s=>s.priority==='P1'&&completed(s.id)).length,p2=lessons.filter(s=>s.priority==='P2'&&completed(s.id)).length;
return `<div class="hero"><div class="eyebrow">LEARN THE SKILLS THAT MATTER</div><h1>実務に必要な技術を、<br>最短の依存関係で学ぶ。</h1><p class="lead">前回整理した<strong>20技能・P0/P1/P2・4段階</strong>をそのまま教材化。公式資料の重要部分を日本語で理解し、コードで試し、合格条件まで確認する。目標はバックエンド・データ連携・既存システム改修の能力。</p></div>
<div class="overview-metrics"><div class="panel metric"><div class="name">習得対象</div><strong>20 <small>技能</small></strong><small>P0 6 / P1 9 / P2 5</small></div><div class="panel metric"><div class="name">実技完了</div><strong>${numDone()} <small>/ 20</small></strong><div class="bar"><span style="width:${numDone()*5}%"></span></div></div><div class="panel metric"><div class="name">優先基礎の完了</div><strong>${p0} <small>/ 6</small></strong><small>先にP0を重点的に</small></div></div>
<div class="panel start-box"><div class="row between" style="flex-wrap:wrap"><span>${pill(next.priority)} <strong style="margin-left:7px">次に学ぶ：${esc(next.title)}</strong></span><a class="btn btn-accent" href="?page=lesson-${next.id}" target="_blank" rel="noopener noreferrer">学習を開く ↗</a></div><p>「要点を読む → コードを試す → 実技課題 → 確認テスト」の順で進む。実技完了は自己申告として保存される。</p></div>
<h2 class="subheading">4段階の学習順序</h2><div class="stage-grid"><div class="stage"><span class="num">STAGE 01</span><strong>既存コードを扱う</strong><p>Python・Git・CLI・デバッグ・SQLの土台を作る。</p></div><div class="stage"><span class="num">STAGE 02</span><strong>動くシステムを作る</strong><p>HTTP・API・DB・データ連携・テストを繋ぐ。</p></div><div class="stage"><span class="num">STAGE 03</span><strong>第三者に提供する</strong><p>セキュリティ・Docker・CI/CD・運用・文書化。</p></div><div class="stage"><span class="num">STAGE 04</span><strong>実務に挑戦する</strong><p>仕様変更・既存コード改修・第三者レビュー。</p></div></div>
<h2 class="subheading">優先順位は維持する</h2><div class="panel card-body"><div class="row between" style="align-items:flex-start"><div><strong>${pill('P0')} 基礎：${p0}/6</strong><p class="small muted">Python / Git / CLI / デバッグ / SQL / HTTP</p></div><a class="btn btn-light" href="?page=catalog-P0" target="_blank" rel="noopener noreferrer">一覧へ ↗</a></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row between" style="align-items:flex-start"><div><strong>${pill('P1')} 実務：${p1}/9</strong><p class="small muted">FastAPIから文書化まで。使えるものを組み上げる。</p></div><a class="btn btn-light" href="?page=catalog-P1" target="_blank" rel="noopener noreferrer">一覧へ ↗</a></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row between" style="align-items:flex-start"><div><strong>${pill('P2')} 専門：${p2}/5</strong><p class="small muted">クラウド・最適化・RPA・AI・フロントエンド。</p></div><a class="btn btn-light" href="?page=catalog-P2" target="_blank" rel="noopener noreferrer">一覧へ ↗</a></div></div>

function catalog(){let list=lessons.filter(s=>(state.filter==='ALL'||s.priority===state.filter)&&(s.title+s.subtitle+s.why+s.steps.join('')).toLowerCase().includes(query.toLowerCase()));return `<div class="page-heading"><div class="eyebrow">CURRICULUM</div><h1>技術一覧</h1><p class="lead">前回の20項目と優先度を維持。各ページに仕組み、例、実技、合格条件、原典リンクを収録。</p></div><div class="toolbar"><input class="search" id="skillSearch" aria-label="技能を検索" placeholder="例：SQL、テスト、API..." value="${esc(query)}"><div class="tabs" role="group" aria-label="優先度で絞り込み">${[['ALL','すべて'],['P0','P0 基礎'],['P1','P1 実務'],['P2','P2 専門']].map(([v,t])=>`<button data-filter="${v}" class="${state.filter===v?'active':''}">${t}</button>`).join('')}</div></div><div class="skill-list" id="skillList">${list.length?list.map(s=>`<a class="skill-card" href="?page=lesson-${s.id}" target="_blank" rel="noopener noreferrer"><div class="row between"><span class="tiny">SKILL ${String(s.id).padStart(2,'0')}</span>${pill(s.priority)}</div><h3>${esc(s.title)}</h3><p>${esc(s.subtitle)}</p><div class="row between" style="margin-top:auto"><span class="status-label">${completed(s.id)?'✓ 実技完了':inProgress(s.id)?'◔ 学習中':'○ 未着手'}</span><span class="tiny">詳しく見る ↗</span></div></a>`).join(''):`<div class="no-results">該当する技能はありません。</div>`}</div>${foot}`;}
function lesson(s){let p=prog(s.id),ts=Array.isArray(p.tasks)?p.tasks:[],quizSelection=p.quiz,allTasks=s.tasks.every((_,i)=>ts[i]);let prev=lessons[s.id-2],next=lessons[s.id];return `<div class="lesson-head"><div class="eyebrow">SKILL ${String(s.id).padStart(2,'0')} / 20 &nbsp; ${pill(s.priority)}</div><h1>${esc(s.title)}</h1><p>${esc(s.subtitle)}</p></div><div class="lesson-layout"><div class="lesson-detail">
<section class="block"><h2>まず、何に使う技術？</h2><p class="scene-example">${esc(s.scene)}</p><h3 style="font-size:13px;margin:0 0 9px">処理の流れ</h3><div class="flow-steps">${s.flow.map((x,i)=>`<div class="flow-step"><b>${['① 入力','② 処理','③ 結果'][i]}</b><span>${esc(x)}</span></div>`).join('')}</div><details class="term-box"><summary>分からない言葉の意味を確認する（${s.terms.length}語）</summary><dl>${s.terms.map(([term,meaning])=>`<dt>${esc(term)}</dt><dd>${esc(meaning)}</dd>`).join('')}</dl></details></section>
<section class="block"><h2>なぜ仕事で必要か</h2><p>${esc(s.why)}</p><div class="notice"><strong>一言でいうと</strong><div>${esc(s.mental)}</div></div></section>
<section class="block"><h2>押さえる仕組み：3つ</h2><ol class="concepts">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>
<section class="block"><div class="row between" style="align-items:flex-start"><h2>コード・設定の例</h2><span class="tiny">${esc(s.lang)}</span></div><p class="small muted">基本構造を理解するための短い例。一部は前提となるファイルや環境が必要。</p><div class="code-box"><div class="code-head"><span>${esc(s.lang)} · 最小例</span><button class="copy-code" data-code="${s.id}">コピー</button></div><pre><code>${esc(s.code)}</code></pre></div><div class="notice"><strong>実行するには</strong><div>${esc(s.run_hint)}</div></div><div class="outcome"><strong>この例を動かすと？</strong><div>${esc(s.result)}</div></div><h3 style="font-size:13px;margin:20px 0 8px">コードの読み方</h3><ol class="concepts">${s.reading.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="notice warn" style="margin-top:15px"><strong>注意点</strong><div>${esc(s.pitfall)}</div></div></section>
<section class="block"><div class="row between"><h2>自分で試す実技課題</h2><span class="tiny" id="taskCount">${ts.filter(Boolean).length} / ${s.tasks.length}</span></div><div class="first-action"><strong>最初の1歩：</strong>${esc(s.first)}</div><div class="checklist">${s.tasks.map((t,i)=>`<label class="task ${ts[i]?'checked':''}"><input type="checkbox" data-task="${i}" ${ts[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div><div class="notice" style="margin-top:18px"><strong>合格条件</strong><div>${esc(s.pass_condition)}</div></div></section>
<section class="block"><h2>理解確認：1問</h2><p>${esc(s.question)}</p><div class="quiz-options">${s.options.map((o,i)=>`<button class="quiz-choice ${quizSelection===i?'selected':''}" data-choice="${i}">${i+1}. ${esc(o)}</button>`).join('')}</div><div id="quizFeedback">${quizSelection===undefined?'':`<div class="quiz-feedback ${quizSelection===s.answer?'good':'bad'}"><strong>${quizSelection===s.answer?'正解':'再確認'}</strong><br>${esc(s.explain)}</div>`}</div></section>
<section class="block"><h2>学習メモ</h2><p class="small muted">試したこと・失敗したこと・まだ分からないことを残す。自動保存される。</p><textarea id="lessonNote" class="note" placeholder="例：JOINの条件とWHEREの違いがあいまい...">${esc(state.notes[s.id]||'')}</textarea><p class="tiny" style="margin-top:5px">この端末のブラウザー内だけに保存されます。</p></section>
<div class="complete"><button class="btn ${p.done?'btn-light':'btn-accent'}" id="completeButton">${p.done?'✓ 実技完了（取り消す）':allTasks&&quizSelection===s.answer?'✓ 実技を完了として記録する':'実技課題と理解確認を終えてから記録する'}</button></div><p class="tiny muted">記録できても第三者による実力認定ではありません。コードが実際に動いたかは自分で確認してください。</p>
<div class="backnext">${prev?`<a class="btn btn-light" href="?page=lesson-${prev.id}" target="_blank" rel="noopener noreferrer">← 前の技能</a>`:`<span></span>`}<a class="btn" href="${next?`?page=lesson-${next.id}`:"?page=project"}" target="_blank" rel="noopener noreferrer">${next?"次の技能 ↗":"実務ポートフォリオへ ↗"}</a></div></div>
<aside class="lesson-aside"><div class="panel aside-card"><h3>この技能の位置づけ</h3>${pill(s.priority)}<p>実技完了：<strong id="currentStatus">${completed(s.id)?'完了':'未完了'}</strong></p><div class="bar"><span id="lessonTaskBar" style="width:${ts.filter(Boolean).length/s.tasks.length*100}%"></span></div><p>課題 ${ts.filter(Boolean).length}/${s.tasks.length} · 理解確認 ${quizSelection===s.answer?'合格':'未合格'}</p></div><div class="panel aside-card"><h3>前提となる技能</h3>${s.deps.length?s.deps.map(id=>`<a href="?page=lesson-${id}" target="_blank" rel="noopener noreferrer">${String(id).padStart(2,'0')} ${esc(lessons[id-1].title)} ↗</a>`).join(''):'<p>特になし。最初の技能から取り組める。</p>'}</div><div class="panel aside-card"><h3>原典・詳しい資料</h3><div class="links">${s.sources.map(([name,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)} <span>↗</span></a>`).join('')}</div><p style="margin-top:14px">要点の確認・詳しい仕様は公式資料へ。</p></div></aside></div>${foot}`;}
function project(){return `<div class="page-heading"><div class="eyebrow">CAPSTONE PROJECT</div><h1>実務ポートフォリオ</h1><p class="lead">前回の「データ収集・加工・保存・提供システム」をそのまま最終課題に設定。画面が動くだけでなく、異常系・再実行・保守まで検証する。</p></div><div class="panel card-body" style="margin-top:24px"><h2 class="card-title">構成とデータの流れ</h2><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:18px 0"><span class="priority-pill pill-P0" style="padding:10px">外部API</span> → <span class="priority-pill pill-P0" style="padding:10px">Python取得・検証</span> → <span class="priority-pill pill-P1" style="padding:10px">SQLで保存</span> → <span class="priority-pill pill-P1" style="padding:10px">FastAPIで公開</span></div><p class="small muted">全体を支える仕組み：pytest・ログ・認可・Docker・GitHub Actions。最初はSQLiteで構築し、必要に応じてPostgreSQLへ拡張する。</p></div>
<div class="overview-metrics" style="grid-template-columns:repeat(2,1fr)"><div class="panel metric"><div class="name">受け入れテスト</div><strong>${state.project.filter(Boolean).length} <small>/ 9</small></strong><div class="bar"><span style="width:${state.project.filter(Boolean).length/9*100}%"></span></div></div><div class="panel metric"><div class="name">完成の判定</div><strong style="font-size:19px">${state.project.length>=9&&projectChecks.every((_,i)=>state.project[i])?'自己確認済み':'検証中'}</strong><small>必ず実行ログとコードを残す</small></div></div>
<div class="panel card-body"><h2 class="card-title">受け入れ条件：9項目</h2><p class="small muted">どれも実際に試してからチェックする。進捗は自動保存される。</p>${projectChecks.map(([name,detail],i)=>`<label class="project-step"><input type="checkbox" data-project="${i}" ${state.project[i]?'checked':''}><div><h3>${i+1}. ${esc(name)}</h3><p>${esc(detail)}</p></div></label>`).join('')}</div><h2 class="subheading">完成を示す証拠</h2><div class="panel card-body"><p><strong>README：</strong>目的、起動手順、システム構成、制約、テスト方法。</p><p><strong>Git履歴：</strong>機能追加・バグ修正を意味のあるコミットに分ける。</p><p><strong>テスト：</strong>正常系・異常系、失敗時のログ、変更前後の差分。</p><p><strong>第三者向け説明：</strong>何を解決するか、どの条件を保証するか、どこまで未対応か。</p></div>${foot}`;}
function sources(){let srcs=[['Python公式チュートリアル','Pythonの言語の仕組みと標準機能','https://docs.python.org/3/tutorial/'],['Pro Git（日本語）','履歴・branch・diff・コミット','https://git-scm.com/book/ja/v2'],['PostgreSQL公式','SQL・テーブル・トランザクション','https://www.postgresql.org/docs/current/tutorial.html'],['MDN HTTP','リクエスト・レスポンス・ステータス','https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview'],['FastAPI公式','API・検証・DB連携','https://fastapi.tiangolo.com/ja/tutorial/'],['pytest公式','自動テスト・fixture・失敗例','https://docs.pytest.org/en/stable/getting-started.html'],['Docker公式','コンテナとCompose','https://docs.docker.com/learn/paths/get-started-with-docker-containers/'],['GitHub Actions','Pythonを変更ごとにテストする','https://docs.github.com/ja/actions/tutorials/build-and-test-code/python'],['OWASP API Security','認証・認可・APIの主要リスク','https://api-security.owasp.org/editions/2023/en/0x11-t10/'],['実例：FastAPI Full Stack Template','実務向け構成のリバースエンジニアリング','https://github.com/fastapi/full-stack-fastapi-template']];return `<div class="page-heading"><div class="eyebrow">PRIMARY SOURCES & BACKUP</div><h1>一次資料・進捗データ</h1><p class="lead">このサイトの解説は公式資料を基に日本語で要約したもの。詳細は原典を確認する。技能ページにも関連リンクを配置している。</p></div><h2 class="subheading">原典リンク</h2><div class="resource-grid">${srcs.map(([title,desc,url])=>`<div class="panel resource-item"><h3>${esc(title)}</h3><p>${esc(desc)}</p><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">公式資料を開く ↗</a></div>`).join('')}</div><h2 class="subheading">進捗のバックアップ</h2><div class="panel card-body"><p>ChatGPT内のファイルプレビューで別タブが制限される場合は、ZIPを解凍し、ChromeなどでこのHTMLを直接開いてください。</p><p>進捗・学習メモはブラウザーのローカルストレージに保存します。別PCに移す場合はJSONをエクスポートし、先の端末でインポートしてください。</p><div class="row" style="flex-wrap:wrap;margin:15px 0"><button class="btn" id="exportButton">進捗をJSONで保存</button><button class="btn btn-light" id="importButton">JSONを読み込む</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div><p class="small muted">ブラウザーデータを削除するとローカル進捗は失われます。秘密情報をメモに保存しないでください。</p><div style="border-top:1px solid var(--line);padding-top:15px"><button class="btn btn-light" id="resetButton">進捗・メモを全消去</button></div></div>${foot}`;}
function render(){$('#page').innerHTML=view==='home'?home():view==='catalog'?catalog():view==='lesson'?lesson(lessons[selectedId-1]):view==='project'?project():sources();$('#crumb').textContent=view==='home'?'全体像':view==='catalog'?'技術一覧':view==='project'?'実務ポートフォリオ':view==='sources'?'一次資料・進捗':`技能 ${selectedId} / 20 — ${lessons[selectedId-1].title}`;/* Navigation links are handled natively by target=_blank. */$('#page').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;save();openView('catalog')});
if(view==='catalog'){let s=$('#skillSearch');if(s)s.oninput=e=>{query=e.target.value;const list=lessons.filter(x=>(state.filter==='ALL'||x.priority===state.filter)&&(x.title+x.subtitle+x.why+x.steps.join('')).toLowerCase().includes(query.toLowerCase()));$('#skillList').innerHTML=list.length?list.map(x=>`<a class="skill-card" href="?page=lesson-${x.id}" target="_blank" rel="noopener noreferrer"><div class="row between"><span class="tiny">SKILL ${String(x.id).padStart(2,'0')}</span>${pill(x.priority)}</div><h3>${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><div class="row between" style="margin-top:auto"><span class="status-label">${completed(x.id)?'✓ 実技完了':inProgress(x.id)?'◔ 学習中':'○ 未着手'}</span><span class="tiny">詳しく見る ↗</span></div></a>`).join(''):'<div class="no-results">該当する技能はありません。</div>';/* Catalog links are native anchors. */};}
if(view==='home'){$('#page').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;save();openView('catalog')})}
if(view==='lesson')attachLesson(lessons[selectedId-1]);if(view==='project'){$('#page').querySelectorAll('[data-project]').forEach(e=>e.onchange=()=>{state.project[Number(e.dataset.project)]=e.checked;save();render();});}if(view==='sources')attachSources();renderSide();updateProgress();}
function attachLesson(s){let ensure=()=>{if(!state.lessons[s.id])state.lessons[s.id]={};if(!Array.isArray(state.lessons[s.id].tasks))state.lessons[s.id].tasks=[];return state.lessons[s.id];};$('#page').querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{let p=ensure();p.tasks[Number(e.dataset.task)]=e.checked;if(!e.checked)p.done=false;save();render();});$('#page').querySelectorAll('[data-choice]').forEach(e=>e.onclick=()=>{let p=ensure();p.quiz=Number(e.dataset.choice);if(p.quiz!==s.answer)p.done=false;save();render();});let note=$('#lessonNote');note.oninput=()=>{state.notes[s.id]=note.value;save()};let comp=$('#completeButton');let p=prog(s.id);let ready=s.tasks.every((_,i)=>p.tasks?.[i])&&p.quiz===s.answer;comp.disabled=!p.done&&!ready;comp.onclick=()=>{let x=ensure();x.done=!x.done;save();render();};$('#page').querySelectorAll('.copy-code').forEach(b=>b.onclick=async()=>{let txt=s.code;try{await navigator.clipboard.writeText(txt);b.textContent='コピーしました';setTimeout(()=>b.textContent='コピー',1100);}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='コピーしました';}catch(_) {b.textContent='選択してコピー';}ta.remove();setTimeout(()=>b.textContent='コピー',1300)}});}
function attachSources(){$('#exportButton').onclick=()=>{let data={format:'skill-lab-progress',version:1,exported:new Date().toISOString(),state:{lessons:state.lessons,project:state.project,notes:state.notes,filter:state.filter}};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='skill-lab-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#importButton').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(d.format!=='skill-lab-progress'||d.version!==1||!d.state||typeof d.state.lessons!=='object'||!Array.isArray(d.state.project)||typeof d.state.notes!=='object')throw Error('このサイトの進捗形式ではありません');if(!confirm('現在の進捗・メモを読み込みデータで置き換えます。続行しますか？'))return;state={lessons:d.state.lessons||{},project:d.state.project,notes:d.state.notes,filter:['ALL','P0','P1','P2'].includes(d.state.filter)?d.state.filter:'ALL'};save();render();alert('読み込みました');}catch(err){alert('読み込めませんでした：'+err.message)}};$('#resetButton').onclick=()=>{if(confirm('すべての進捗とメモを消去します。取り消せません。続行しますか？')){state={lessons:{},project:[],filter:'ALL',notes:{}};save();render();}};}
/* Sidebar links are native anchors: no click interception. */
$('#menuButton').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('open')};$('#overlay').onclick=closeMenu;
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
function applyInitialRoute(){const route=new URLSearchParams(location.search).get('page')||location.hash.slice(1)||'home';const match=/^lesson-(\d+)$/.exec(route);if(match){const id=Number(match[1]);if(id>=1&&id<=20){selectedId=id;view='lesson';return;}}const cat=/^catalog(?:-(P0|P1|P2))?$/.exec(route);if(cat){view='catalog';if(cat[1])state.filter=cat[1];return;}if(['home','project','sources'].includes(route)){view=route;return;}view='home';}
window.addEventListener('hashchange',()=>{applyInitialRoute();render();});
applyInitialRoute();
render();
})();
</script>
</body>
</html>
